<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos · Provee Express</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="shop admin">
  <header class="nav">
    <a class="logo" href="/panel.html"><span class="logo-mark" title="Provee Express"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.4l2.3 11a1.7 1.7 0 0 0 1.7 1.4h8.4a1.7 1.7 0 0 0 1.7-1.3l1.6-7.1H6"/><circle cx="9.6" cy="20" r="1.5"/><circle cx="17.2" cy="20" r="1.5"/></svg></span><span>Provee Express<small>Mesa de pedidos · Envíos</small></span></a>

    <nav class="nav-links">
      <a href="/panel.html">← Volver al panel</a>
    </nav>

  <main class="wrap" style="max-width:1400px">
    <h2 class="sec" style="margin-top:.4rem">Pedidos <small id="cnt"></small></h2>
    <div class="panel" style="display:grid;gap:.7rem;margin-bottom:1rem">
      <input id="q" placeholder="Buscar por número, cliente, socio o dirección…" autocomplete="off">
      <div class="chips" id="fEstado" style="margin:0"></div>
      <div class="chips" id="fCanal" style="margin:0"></div>
    </div>
    <div class="orders-grid" id="lista"></div>
  </main>
  <footer class="foot"><span></span><span class="brand">Provee Express · 2026</span><span id="clock"></span></footer>
  <div class="toast" id="toast"></div>
  <script src="pedidos.js"></script>

</html>
