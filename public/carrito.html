<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito · La Esquina Socios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="shop">
  <main class="wrap" style="max-width:900px">
    <h2 class="sec">🧺 Mi carrito</h2>
    <div class="card order" id="cart"></div>
    <h2 class="sec">🛵 Datos de entrega</h2>
    <form class="card" id="f" style="display:grid;gap:.8rem">
      <label>Dirección <input name="direccion" required></label>
      <div class="form2">
        <label>Zona <select name="zona" id="zona" required><option value="">Elegí tu zona</option></select></label>
        <label>Día <select name="dia"><option>Hoy</option><option>Mañana</option></select></label>
        <label>Franja horaria <select name="franja" id="franja" required></select></label>
        <label>Forma de pago <select name="pago" id="pago" required></select></label>
      </div>
      <label>Notas para el repartidor <input name="notas" placeholder="Timbre, piso, referencias…"></label>
      <div id="tot"></div>
      <div class="err" id="err"></div>
      <button id="go">Confirmar pedido</button>
    </form>
  </main>
  <script src="tienda.js"></script>
  <script>
    let neg, cart;
    const PAGO = { efectivo: 'Efectivo', transferencia: 'Transferencia', tarjeta_debito: 'Tarjeta de débito', tarjeta_credito: 'Tarjeta de crédito', mercado_pago: 'Mercado Pago' };
    function totales() {
      const z = neg.zonas.find((x) => x.zona === $('#zona').value);
      const envio = !z ? null : cart.subtotal >= neg.envioGratis ? 0 : z.costo_envio;
      const falta = neg.minimo - cart.subtotal;
      $('#tot').innerHTML = `<div class="summary">Subtotal ${money(cart.subtotal)} · Envío ${envio === 0 ? 'gratis' : money(envio)} · <b>Total ${money(cart.subtotal + (envio || 0))}</b>
        ${falta > 0 ? `<br>⚠ Te faltan ${money(falta)} para el pedido mínimo.` : cart.subtotal < neg.envioGratis ? `<br>Sumá ${money(neg.envioGratis - cart.subtotal)} y el envío es gratis.` : ''}</div>`;
      $('#go').disabled = !cart.items.length || falta > 0;
    }
    function render() {
      $('#cart').innerHTML = cart.items.length ? `<table>${cart.items.map((i) => `<tr>
          <td style="font-size:1.6rem">${i.emoji}</td>
          <td>${esc(i.nombre)} ${i.tipo === 'promo' ? '<span class="pill info">promo</span>' : ''} ${i.sinStock ? '<span class="pill danger">stock insuficiente</span>' : ''}<br><small>${money(i.precio)}${i.unidad === 'kg' ? ' /kg' : ''}</small></td>
          <td class="num" style="white-space:nowrap">
            <button class="small ghost" data-q="${i.tipo}|${i.id}|${i.unidad === 'kg' ? -0.5 : -1}">−</button>
            <b style="display:inline-block;min-width:2.5em;text-align:center">${i.cantidad}${i.unidad === 'kg' ? ' kg' : ''}</b>
            <button class="small ghost" data-q="${i.tipo}|${i.id}|${i.unidad === 'kg' ? 0.5 : 1}">+</button></td>
          <td class="num"><b>${money(i.subtotal)}</b></td></tr>`).join('')}</table>`
        : '<div class="empty">Tu carrito está vacío. <a href="/productos.html">Ir a productos</a></div>';
      setCartCount(cart);
      totales();
    }
    document.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-q]'); if (!b) return;
      const [tipo, id, d] = b.dataset.q.split('|');
      cart = await api('/api/carrito', { method: 'POST', body: { tipo, id, cantidad: Number(d) } });
      render();
    });
    (async () => {
      const me = await header();
      [neg, cart] = await Promise.all([api('/api/negocio-publico'), api('/api/carrito')]);
      $('#zona').innerHTML += neg.zonas.map((z) => `<option value="${esc(z.zona)}">${esc(z.zona)} (envío ${money(z.costo_envio)})</option>`).join('');
      $('#franja').innerHTML = neg.franjas.map((x) => `<option>${esc(x)}</option>`).join('');
      $('#pago').innerHTML = neg.pagos.map((x) => `<option value="${x}">${PAGO[x] || x}</option>`).join('');
      const f = $('#f');
      f.direccion.value = me.direccion || '';
      f.zona.value = me.zona || '';
      $('#zona').onchange = totales;
      render();
    })();
    $('#f').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        const o = await api('/api/checkout', { method: 'POST', body: { direccion: f.direccion.value, zona: f.zona.value, dia: f.dia.value, franja: f.franja.value, pago: f.pago.value, notas: f.notas.value } });
        document.querySelector('main').innerHTML = `<div class="hero" style="margin-top:1rem"><div><h2>✔ ¡Pedido ${o.number} recibido!</h2>
          <div>Total ${money(o.total)} · ${esc(o.zone)} · ${esc(o.deliveryDay || '')} ${esc(o.deliverySlot)}. Te avisamos cuando salga el repartidor.</div></div>
          <div class="spacer"></div><a class="btn-light" href="/">Volver al inicio</a></div>`;
        setCartCount({ items: [] });
      } catch (err) { $('#err').textContent = err.message; }
    };
  </script>
</body>
</html>
