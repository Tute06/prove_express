<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito · Provee Express</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="shop">
  <main class="wrap">
    <h2 class="sec" style="margin-top:.6rem">Tu carrito <small id="cnt"></small></h2>
    <div class="checkout">
      <section class="panel" id="cart"></section>
      <form class="panel" id="f" style="display:grid;gap:.8rem">
        <span class="eyebrow">Datos de entrega</span>
        <label>Dirección <input name="direccion" required></label>
        <div class="form2">
          <label>Zona <select name="zona" id="zona" required><option value="">Elegí tu zona</option></select></label>
          <label>Día <select name="dia"><option>Hoy</option><option>Mañana</option></select></label>
          <label>Franja horaria <select name="franja" id="franja" required></select></label>
          <label>Forma de pago <select name="pago" id="pago" required></select></label>
        </div>
        <label>Notas para el repartidor <input name="notas" placeholder="Timbre, piso, referencias…"></label>
        <div id="tot"></div>
        <div class="err" id="err"></div>
        <button class="btn-main" id="go">Confirmar pedido</button>
      </form>
    </div>
  </main>
  <script src="tienda.js"></script>
  <script>
    let neg, cart;
    const PAGO = { efectivo: 'Efectivo', transferencia: 'Transferencia', tarjeta_debito: 'Tarjeta de débito', tarjeta_credito: 'Tarjeta de crédito', mercado_pago: 'Mercado Pago' };
    function totales() {
      const z = neg.zonas.find((x) => x.zona === $('#zona').value);
      const envio = !z ? null : cart.subtotal >= neg.envioGratis ? 0 : z.costo_envio;
      const falta = neg.minimo - cart.subtotal;
      // Descuento por forma de pago (sobre productos, no sobre el envío); el servidor lo recalcula igual.
      const pago = $('#pago').value;
      const pct = neg.descuentos[pago] || 0;
      const desc = Math.round(cart.subtotal * pct / 100);
      const [mejor, mejorPct] = Object.entries(neg.descuentos).sort((a, b) => b[1] - a[1])[0] || [];
      $('#tot').innerHTML = `<div class="totals">
        <div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${money(cart.subtotal)}</span></div>
        ${pct ? `<div style="display:flex;justify-content:space-between;color:var(--accent)"><span>Descuento ${PAGO[pago].toLowerCase()} (${pct}%)</span><span>−${money(desc)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between"><span>Envío</span><span>${envio === 0 ? 'Gratis' : z ? money(envio) : 'elegí tu zona'}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span>Total</span><span class="big">${money(cart.subtotal - desc + (envio || 0))}</span></div>
        ${falta > 0 ? `<span class="warn">Te faltan ${money(falta)} para el pedido mínimo</span>` : cart.subtotal < neg.envioGratis ? `<span class="warn">Sumá ${money(neg.envioGratis - cart.subtotal)} y el envío es gratis</span>` : ''}
        ${!pct && mejorPct ? `<span class="warn">💡 Pagando en ${PAGO[mejor].toLowerCase()} tenés ${mejorPct}% de descuento: ahorrás ${money(Math.round(cart.subtotal * mejorPct / 100))}</span>` : ''}</div>`;
      $('#go').disabled = !cart.items.length || falta > 0;
    }
    function render() {
      $('#cnt').textContent = cart.items.length ? `${cart.items.length} productos` : '';
      $('#cart').innerHTML = cart.items.length ? `<table class="cart-table">${cart.items.map((i) => `<tr>
          <td style="width:60px"><div class="e${i.img ? ' foto' : ''}">${thumb(i)}</div></td>
          <td><b style="font-size:.95rem">${esc(i.nombre)}</b> ${i.tipo === 'promo' ? '<span class="pill info">promo</span>' : ''} ${i.precioAntes ? '<span class="pill danger">oferta</span>' : ''} ${i.sinStock ? '<span class="pill danger">stock insuficiente</span>' : ''}
            <br><small style="color:var(--muted)">${money(i.precio)}${i.unidad === 'kg' ? ' /kg' : ''}</small></td>
          <td class="num"><span class="qty">
            <button type="button" data-q="${i.tipo}|${i.id}|${i.unidad === 'kg' ? -0.5 : -1}">−</button>
            <b>${i.cantidad}${i.unidad === 'kg' ? ' kg' : ''}</b>
            <button type="button" data-q="${i.tipo}|${i.id}|${i.unidad === 'kg' ? 0.5 : 1}">+</button></span></td>
          <td class="num"><b>${money(i.subtotal)}</b></td></tr>`).join('')}</table>`
        : '<div class="empty">Tu carrito está vacío.<br><br><a class="cta" href="/productos.html">Ir a productos <span>→</span></a></div>';
      setCartCount(cart);
      totales();
    }
    document.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-q]'); if (!b) return;
      const [tipo, id, d] = b.dataset.q.split('|');
      cart = await api('/api/carrito', { method: 'POST', body: { tipo, id, cantidad: Number(d) } });
      render();
    });
    (async () => {
      const me = await header();
      [neg, cart] = await Promise.all([api('/api/negocio-publico'), api('/api/carrito')]);
      $('#zona').innerHTML += neg.zonas.map((z) => `<option value="${esc(z.zona)}">${esc(z.zona)} · envío ${money(z.costo_envio)}</option>`).join('');
      $('#franja').innerHTML = neg.franjas.map((x) => `<option>${esc(x)}</option>`).join('');
      $('#pago').innerHTML = neg.pagos.map((x) => `<option value="${x}">${PAGO[x] || x}${neg.descuentos[x] ? ` · ${neg.descuentos[x]}% off` : ''}</option>`).join('');
      const f = $('#f');
      f.direccion.value = me.direccion || '';
      f.zona.value = me.zona || '';
      $('#zona').onchange = totales;
      $('#pago').onchange = totales;
      render();
    })();
    $('#f').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        const o = await api('/api/checkout', { method: 'POST', body: { direccion: f.direccion.value, zona: f.zona.value, dia: f.dia.value, franja: f.franja.value, pago: f.pago.value, notas: f.notas.value } });
        document.querySelector('main').innerHTML = `<section class="bento" style="grid-template-columns:1fr;margin-top:1rem"><div class="tile tile-hero" style="min-height:260px">
          <span class="eyebrow" style="color:var(--accent)">Pedido ${o.number}</span>
          <h1>¡Listo! <em>Ya lo estamos preparando.</em></h1>
          <p>Total ${money(o.total)} · ${esc(o.zone)} · ${esc(o.deliveryDay || '')} ${esc(o.deliverySlot)}. Te avisamos cuando salga el repartidor.</p>
          <a class="cta" href="/">Volver al inicio <span>→</span></a></div></section>`;
        setCartCount({ items: [] });
      } catch (err) { $('#err').textContent = err.message; }
    };
  </script>
</body>
</html>
