<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · La Esquina Socios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="shop">
  <main class="wrap">
    <section class="hero">
      <div>
        <h2 id="hola">¡Hola!</h2>
        <div>Tus compras del súper, con envío a domicilio y precios de socio.</div>
      </div>
      <div class="spacer"></div>
      <a class="btn-light" href="/perfil.html">👤 Administrar mi perfil</a>
      <a class="cta" href="/productos.html">🛍️ Presione aquí para iniciar su compra</a>
    </section>
    <div id="ia"></div>
    <h2 class="sec">🔥 Ofertas, combos y promociones <small style="color:var(--muted);font-weight:400">las más nuevas primero</small></h2>
    <div class="promos" id="promos"></div>
    <h2 class="sec" id="misPedT" style="display:none">📦 Mis pedidos</h2>
    <div id="misPed"></div>
  </main>
  <script src="tienda.js"></script>
  <script>
    const TIPO = { oferta: ['Oferta', 'danger'], combo: ['Combo', 'info'], promo: ['Promo', 'warn'] };
    const EST = { borrador: 'En revisión', confirmado: 'Confirmado', preparando: 'Preparando', en_camino: 'En camino 🛵', entregado: 'Entregado ✔', cancelado: 'Cancelado' };
    (async () => {
      const me = await header();
      $('#hola').textContent = `¡Hola, ${me.nombre.split(' ')[0]}!`;
      iaBox($('#ia'));
      const promos = await api('/api/promos');
      $('#promos').innerHTML = promos.map((p) => {
        const [t, c] = TIPO[p.tipo];
        const nuevo = Date.now() - Date.parse(p.creada) < 36 * 3600 * 1000;
        return `<div class="promo"><div class="em">${p.emoji}</div>
          <div><span class="pill ${c} tipo">${t}</span> ${nuevo ? '<span class="pill">Nuevo</span>' : ''}</div>
          <b>${esc(p.titulo)}</b><small>${esc(p.detalle)}</small>
          ${p.precio != null ? `<div class="precio">${money(p.precio)}<span class="antes">${money(p.precio_antes)}</span></div>
          <button class="small" data-addpromo="${p.id}">Agregar al carrito</button>` : ''}</div>`;
      }).join('');
      const peds = await api('/api/mis-pedidos');
      if (peds.length) {
        $('#misPedT').style.display = '';
        $('#misPed').innerHTML = peds.map((o) => `<div class="card" style="margin-bottom:.4rem;display:flex;gap:1rem;flex-wrap:wrap">
          <b>${o.number}</b><span>${new Date(o.createdAt).toLocaleString('es-AR')}</span><span>${o.items.length} ítems</span><b>${money(o.total)}</b>
          <span class="pill">${EST[o.status] || o.status}</span></div>`).join('');
      }
    })();
  </script>
</body>
</html>
