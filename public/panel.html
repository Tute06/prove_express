<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provee Express · Mesa de pedidos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="shop admin">
  <header class="nav">
    <a class="logo" href="/panel.html"><span class="logo-mark">PE</span><span>Provee Express<small>Mesa de pedidos · Envíos</small></span></a>
    <div style="flex:1"></div>
    <nav class="nav-links">
      <span id="aiStatus" class="pill">IA …</span>
      <a class="hide-sm" href="/" target="_blank">Tienda de socios ↗</a>
      <a class="cart-pill" href="chat.html" target="_blank">💬 Chat cliente (WhatsApp simulado)</a>
    </nav>
  </header>

  <main>
  <section class="kpis" id="kpis"></section>
  <section class="grid">
    <section>
      <div class="card">
        <h2><span class="eyebrow" style="display:block;width:100%">Todos los canales</span>Bandeja unificada <span class="pill count" id="inboxCount">0</span></h2>
        <div class="inbox" id="inbox"></div>
      </div>
      <div class="card" style="margin-top:.8rem">
        <h2>Cargar mensaje de otro canal</h2>
        <form class="ingest" id="ingest">
          <select name="channel">
            <option value="whatsapp">WhatsApp (pegar mensaje)</option>
            <option value="telefono">Llamado telefónico (notas o transcripción)</option>
          </select>
          <div class="two">
            <input name="name" placeholder="Nombre">
            <input name="phone" placeholder="Teléfono">
          </div>
          <textarea name="text" placeholder="Pegá el mensaje o escribí lo que dijo el cliente…" required></textarea>
          <button type="submit">Procesar con IA</button>
          <div class="examples" id="examples"></div>
        </form>
      </div>
    </section>

    <section class="card" id="detail">
      <div class="empty">Elegí una conversación de la bandeja.</div>
    </section>

    <section class="card">
      <h2>Pedidos</h2>
      <div class="board" id="board"></div>
    </section>
  </section>
  </main>
  <footer class="foot"><span></span><span class="brand">Provee Express · 2026</span><span id="clock"></span></footer>
  <div class="toast" id="toast"></div>
  <script src="panel.js"></script>
</body>
</html>
