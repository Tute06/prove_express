<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso administración · Provee Express</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tienda.css">
</head>
<body class="shop">
  <main class="login-split">
    <section class="login-brand">
      <a class="logo" style="color:#fff !important"><span class="logo-mark" style="background:var(--accent);color:var(--navy)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.4l2.3 11a1.7 1.7 0 0 0 1.7 1.4h8.4a1.7 1.7 0 0 0 1.7-1.3l1.6-7.1H6"/><circle cx="9.6" cy="20" r="1.5"/><circle cx="17.2" cy="20" r="1.5"/></svg></span><span>Provee Express<small style="color:#9fb3d1">Mesa de pedidos · Envíos</small></span></a>
      <div class="brand-copy">
        <h1>Todos los pedidos, <em>en un solo lugar.</em></h1>
      </div>
    </section>
    <section class="login-form">
      <form id="f">
        <span class="eyebrow">Acceso para el equipo de envíos</span>
        <h2>Panel de administración</h2>
        <label>Usuario <input name="usuario" autocomplete="username" required></label>
        <label>Clave <input name="clave" type="password" autocomplete="current-password" required></label>
        <div class="err" id="err"></div>
        <button class="btn-main">Ingresar</button>
        <div class="demo" id="demo" style="display:none"></div>
        <a href="/login.html" style="font-size:.85rem;text-align:center">¿Sos socio? Ingresá a la tienda</a>
      </form>
    </section>
  </main>
  <footer class="foot"><span></span><span class="brand">Provee Express · 2026</span><span id="clock"></span></footer>
  <script>
    const clock = document.getElementById('clock');
    const tick = () => { clock.textContent = new Date().toLocaleString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
    tick(); setInterval(tick, 1000);
    fetch('/api/admin/demo').then((r) => r.json()).then((d) => {
      if (!d.usuario) return;
      const el = document.getElementById('demo');
      el.innerHTML = 'Demo para el jurado: usuario <b></b> · clave <b></b>';
      el.querySelectorAll('b')[0].textContent = d.usuario;
      el.querySelectorAll('b')[1].textContent = d.clave;
      el.style.display = '';
    }).catch(() => {});
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario: f.usuario.value, clave: f.clave.value }) });
      const d = await res.json();
      if (res.ok) location.href = '/panel.html'; else document.getElementById('err').textContent = d.error;
    };
  </script>
</body>
</html>
