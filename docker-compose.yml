services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - datos:/data
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # :z por SELinux (Rocky/Alma/Fedora)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
volumes:
  datos:
